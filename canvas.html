<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1400, initial-scale=1">
<title>CodexPy — Design canvas</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="app/tokens.css">

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>
  html, body { background: #f0eee9; margin: 0; }
  .ab { background: var(--bg); border-radius: 14px; overflow: hidden; box-shadow: 0 1px 2px rgba(0,0,0,0.06); height: 100%; }
  .ab-content { padding: 32px; }
  .swatch { display: flex; flex-direction: column; gap: 8px; }
  .sw {
    display: grid; grid-template-columns: 64px 1fr auto;
    gap: 12px; align-items: center; padding: 10px 14px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
  }
  .sw-chip { width: 64px; height: 44px; border-radius: 8px; border: 1px solid rgba(0,0,0,0.05); }
  .sw .name { font-size: 13px; font-weight: 500; }
  .sw .meta { font-size: 11px; color: var(--muted); }
  .sw .hex { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); }

  .type-row {
    display: grid; grid-template-columns: 100px 1fr;
    gap: 16px; padding: 14px 0; align-items: baseline;
    border-bottom: 1px solid var(--hairline);
  }
  .type-row:last-child { border-bottom: none; }
  .type-row .lbl { font-size: 12px; color: var(--muted); font-family: var(--font-mono); }
  .type-row .sample { color: var(--ink); line-height: 1.1; }

  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }

  .scene-card {
    padding: 18px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    height: 100%;
  }
  .scene-card .preview {
    background: linear-gradient(135deg, var(--bg-sunk), var(--surface-2));
    border: 1px solid var(--border);
    border-radius: 10px;
    aspect-ratio: 16 / 10;
    display: grid;
    place-items: center;
    color: var(--muted);
    font-family: var(--font-mono);
    font-size: 12px;
    text-align: center;
    padding: 16px;
  }
  .scene-card .meta {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
    margin-top: 14px;
    font-size: 12px;
  }
  .scene-card .meta b { font-family: var(--font-mono); color: var(--ink); font-size: 11.5px; font-weight: 500; }
  .scene-card .meta .row { display: flex; flex-direction: column; gap: 2px; padding: 8px 10px; background: var(--bg-sunk); border-radius: 6px; }
  .scene-card .meta .row span { color: var(--muted); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; }

  .embed {
    width: 100%; height: 100%;
    border: 0; display: block;
  }

  /* Phone frames */
  .phone {
    width: 280px; height: 580px;
    border-radius: 36px;
    background: #1f1c18;
    padding: 8px;
    margin: 0 auto;
    box-shadow: 0 24px 60px -16px rgba(0,0,0,0.25);
    position: relative;
  }
  .phone .screen {
    width: 100%; height: 100%; border-radius: 30px; background: var(--bg); overflow: hidden; position: relative;
  }
  .phone .notch {
    position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
    width: 90px; height: 22px; border-radius: 999px; background: #000; z-index: 2;
  }
</style>
</head>
<body>
  <div id="root"></div>

  <!-- Canvas only; no prototype scripts needed here -->
  <script type="text/babel" src="design-canvas.jsx"></script>

  <script type="text/babel" data-presets="react">
// Canvas — no hooks needed; components are pure render

// ===== Style guide content components =====

const Swatch = ({ name, hex, role }) => (
  <div className="sw">
    <div className="sw-chip" style={{ background: hex }} />
    <div>
      <div className="name">{name}</div>
      <div className="meta">{role}</div>
    </div>
    <div className="hex">{hex}</div>
  </div>
);

function StyleGuideColors() {
  return (
    <div className="ab-content">
      <div className="eyebrow" style={{ marginBottom: 6 }}>Foundations · Color</div>
      <h2 className="h1" style={{ marginBottom: 18 }}>Warm. Python blue. Yellow that earns its keep.</h2>
      <p style={{ color: "var(--muted)", maxWidth: 640, marginBottom: 28 }}>
        Cream off-white is the system's base — warmer than #FAFAFA, more inviting than pure neutral.
        Python brand colors are present but used with restraint: blue for primary action and trust, yellow for celebration and accent.
        All semantic colors meet WCAG AA in both light and dark themes.
      </p>

      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 24 }}>
        <div>
          <div className="eyebrow" style={{ marginBottom: 10 }}>Brand</div>
          <div className="swatch">
            <Swatch name="Python Blue" hex="#3776AB" role="Primary action, links, focus" />
            <Swatch name="Python Blue · dark" hex="#2C5F8A" role="Hover, dense ink" />
            <Swatch name="Python Yellow" hex="#FFD43B" role="Accent, celebration, CTAs" />
            <Swatch name="Python Yellow · dark" hex="#F0BD0F" role="Hover, sparingly" />
          </div>
        </div>
        <div>
          <div className="eyebrow" style={{ marginBottom: 10 }}>Neutrals</div>
          <div className="swatch">
            <Swatch name="Ink" hex="#1A1A1F" role="Body text, headlines" />
            <Swatch name="Muted" hex="#6B6F76" role="Secondary text" />
            <Swatch name="Background" hex="#FAF7F2" role="App canvas" />
            <Swatch name="Surface" hex="#FFFFFF" role="Cards" />
            <Swatch name="Border" hex="#ECE7DD" role="Card edges, dividers" />
          </div>
        </div>
        <div>
          <div className="eyebrow" style={{ marginBottom: 10 }}>Semantic</div>
          <div className="swatch">
            <Swatch name="Success" hex="#10B981" role="Correct, complete" />
            <Swatch name="Warning" hex="#F59E0B" role="Caution" />
            <Swatch name="Error" hex="#EF4444" role="Wrong answer, destructive" />
            <Swatch name="Info" hex="#3B82F6" role="Hints, blue alerts" />
          </div>
        </div>
      </div>

      <div style={{ marginTop: 28 }}>
        <div className="eyebrow" style={{ marginBottom: 10 }}>Dark mode</div>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(5, 1fr)", gap: 10, padding: 18, background: "#0B1220", borderRadius: 12 }}>
          {[
            ["Background", "#0B1220"], ["Sunk", "#060A13"], ["Surface", "#111A2E"],
            ["Elevated", "#142039"], ["Ink", "#F1EEE8"],
          ].map(([n, h]) => (
            <div key={n} style={{ background: h, padding: "20px 14px", borderRadius: 8, border: "1px solid rgba(255,255,255,0.08)" }}>
              <div style={{ color: "#F1EEE8", fontSize: 12, fontWeight: 500 }}>{n}</div>
              <div style={{ color: "#8B96AB", fontFamily: "var(--font-mono)", fontSize: 11, marginTop: 4 }}>{h}</div>
            </div>
          ))}
        </div>
      </div>

      <div style={{ marginTop: 28 }}>
        <div className="eyebrow" style={{ marginBottom: 10 }}>Difficulty tags</div>
        <div style={{ display: "flex", gap: 12 }}>
          <span className="tag beg dot">Beginner</span>
          <span className="tag int dot">Intermediate</span>
          <span className="tag adv dot">Advanced</span>
        </div>
      </div>
    </div>
  );
}

function StyleGuideType() {
  return (
    <div className="ab-content">
      <div className="eyebrow" style={{ marginBottom: 6 }}>Foundations · Type</div>
      <h2 className="h1" style={{ marginBottom: 18 }}>Geist for everything human. JetBrains Mono for everything Python.</h2>
      <p style={{ color: "var(--muted)", maxWidth: 640, marginBottom: 28 }}>
        Geist gives the system a confident, slightly mechanical voice — short xheight, geometric forms, modern proportions.
        JetBrains Mono with ligatures is reserved for Python code, file names, and any small mono-flavoured chrome
        ("Py" wordmark, timer, hex values).
      </p>

      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 32 }}>
        <div>
          <div className="eyebrow" style={{ marginBottom: 10 }}>Display & body — Geist</div>
          <div className="type-row"><span className="lbl">60 / 1.1</span><span className="sample" style={{ fontSize: 60, fontWeight: 600, letterSpacing: "-0.025em" }}>Display</span></div>
          <div className="type-row"><span className="lbl">48 / 1.1</span><span className="sample" style={{ fontSize: 48, fontWeight: 600, letterSpacing: "-0.02em" }}>Hero title</span></div>
          <div className="type-row"><span className="lbl">36 / 1.1</span><span className="sample" style={{ fontSize: 36, fontWeight: 600, letterSpacing: "-0.02em" }}>H1 page title</span></div>
          <div className="type-row"><span className="lbl">24 / 1.2</span><span className="sample" style={{ fontSize: 24, fontWeight: 600, letterSpacing: "-0.015em" }}>H2 section</span></div>
          <div className="type-row"><span className="lbl">18 / 1.3</span><span className="sample" style={{ fontSize: 18, fontWeight: 600 }}>H3 card</span></div>
          <div className="type-row"><span className="lbl">16 / 1.55</span><span className="sample" style={{ fontSize: 16 }}>Body — the long-form copy in lessons.</span></div>
          <div className="type-row"><span className="lbl">14 / 1.5</span><span className="sample" style={{ fontSize: 14 }}>UI default — buttons, labels, table cells.</span></div>
          <div className="type-row"><span className="lbl">12 / 1.4</span><span className="sample" style={{ fontSize: 12, color: "var(--muted)" }}>Meta — captions, timestamps, microcopy.</span></div>
        </div>
        <div>
          <div className="eyebrow" style={{ marginBottom: 10 }}>Code — JetBrains Mono</div>
          <div style={{ background: "#0F1729", borderRadius: 10, padding: 18, fontFamily: "var(--font-mono)", fontSize: 14, lineHeight: 1.7 }}>
            <span style={{ color: "#FFD43B" }}>def</span> <span style={{ color: "#5B97CB" }}>greet</span>(<span style={{ color: "#E8EAEE" }}>name: str</span>) {"-"}{"-"}{">"} <span style={{ color: "#E8EAEE" }}>None</span>:<br/>
            &nbsp;&nbsp;&nbsp;&nbsp;<span style={{ color: "#88D498" }}>{'"""Print a friendly hello."""'}</span><br/>
            &nbsp;&nbsp;&nbsp;&nbsp;<span style={{ color: "#5B97CB" }}>print</span>(<span style={{ color: "#88D498" }}>f"Hello, {"{"}name{"}"}!"</span>)<br/>
            <br/>
            <span style={{ color: "#FFD43B" }}>for</span> n <span style={{ color: "#FFD43B" }}>in</span> [<span style={{ color: "#88D498" }}>"Maya"</span>, <span style={{ color: "#88D498" }}>"Yusra"</span>, <span style={{ color: "#88D498" }}>"Pri"</span>]:<br/>
            &nbsp;&nbsp;&nbsp;&nbsp;<span style={{ color: "#5B97CB" }}>greet</span>(n)<br/>
            <br/>
            <span style={{ color: "#6B7895", fontStyle: "italic" }}># Hello, Maya!</span><br/>
            <span style={{ color: "#6B7895", fontStyle: "italic" }}># Hello, Yusra!</span><br/>
            <span style={{ color: "#6B7895", fontStyle: "italic" }}># Hello, Pri!</span><br/>
          </div>

          <div className="eyebrow" style={{ margin: "24px 0 10px" }}>Atkinson Hyperlegible (Lens fallback)</div>
          <div style={{ fontFamily: "'Atkinson Hyperlegible', sans-serif", fontSize: 18, lineHeight: 1.65, color: "var(--ink)" }}>
            When Lens · Dyslexia font is on, all UI swaps to Atkinson Hyperlegible. Wider letterforms, distinguishable b/d/p/q and Il1, no kerning surprises.
          </div>
        </div>
      </div>
    </div>
  );
}

function StyleGuideSpace() {
  const space = [4, 8, 12, 16, 20, 24, 32, 40, 56, 72];
  return (
    <div className="ab-content">
      <div className="eyebrow" style={{ marginBottom: 6 }}>Foundations · Space, radius, shadow</div>
      <h2 className="h1" style={{ marginBottom: 18 }}>8 px grid, with 4 for micro-spacing.</h2>
      <p style={{ color: "var(--muted)", maxWidth: 640, marginBottom: 28 }}>
        Components round to 10–14 px (cozy enough for learners, sharp enough to feel modern).
        Shadows are layered low: ambient + tighter close shadow.
      </p>

      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 32 }}>
        <div>
          <div className="eyebrow" style={{ marginBottom: 10 }}>Space scale</div>
          <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
            {space.map(s => (
              <div key={s} style={{ display: "grid", gridTemplateColumns: "44px 1fr", alignItems: "center", gap: 14 }}>
                <span style={{ fontFamily: "var(--font-mono)", fontSize: 12, color: "var(--muted)" }}>{s}px</span>
                <span style={{ height: 8, width: s, background: "var(--py-blue)", borderRadius: 2 }} />
              </div>
            ))}
          </div>
        </div>

        <div>
          <div className="eyebrow" style={{ marginBottom: 10 }}>Radius</div>
          <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
            {[
              ["xs · 4", 4], ["sm · 6", 6], ["md · 10", 10],
              ["lg · 14", 14], ["xl · 20", 20], ["2xl · 28", 28],
              ["pill · 999", 999],
            ].map(([l, r]) => (
              <div key={l} style={{ display: "grid", gridTemplateColumns: "60px 1fr", gap: 14, alignItems: "center" }}>
                <div style={{ background: "var(--surface)", border: "1px solid var(--border)", height: 36, borderRadius: r }} />
                <span style={{ fontSize: 12.5 }}>{l}</span>
              </div>
            ))}
          </div>
        </div>

        <div>
          <div className="eyebrow" style={{ marginBottom: 10 }}>Shadow</div>
          <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
            {[
              ["sh-1 · hairline", "var(--sh-1)"],
              ["sh-2 · card", "var(--sh-2)"],
              ["sh-3 · hover", "var(--sh-3)"],
              ["sh-4 · modal", "var(--sh-4)"],
              ["sh-yellow · CTA", "var(--sh-yellow)"],
            ].map(([l, v]) => (
              <div key={l} style={{ background: "var(--surface)", padding: 14, borderRadius: 10, boxShadow: v }}>
                <div style={{ fontSize: 12 }}>{l}</div>
              </div>
            ))}
          </div>
        </div>
      </div>

      <div style={{ marginTop: 32 }}>
        <div className="eyebrow" style={{ marginBottom: 10 }}>Density</div>
        <p style={{ color: "var(--muted)", fontSize: 13, marginBottom: 16 }}>Three density modes. Available via Tweaks. Affects padding, gap, and row height across the whole product.</p>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 16 }}>
          {[
            ["Cozy", "32 / 28 / 20 / 64", "Reading-heavy. Default for school audience."],
            ["Comfortable", "24 / 20 / 16 / 56", "Default. Used everywhere."],
            ["Compact", "16 / 12 / 10 / 44", "Power users. Admin tables. Self-learner dense data."],
          ].map(([name, vals, note]) => (
            <div key={name} className="card" style={{ padding: 18 }}>
              <div style={{ fontWeight: 600, marginBottom: 4 }}>{name}</div>
              <div style={{ fontFamily: "var(--font-mono)", fontSize: 11, color: "var(--muted)", marginBottom: 6 }}>{vals}</div>
              <div style={{ fontSize: 12, color: "var(--muted)" }}>{note}</div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

function ComponentLibrary() {
  return (
    <div className="ab-content">
      <div className="eyebrow" style={{ marginBottom: 6 }}>Components</div>
      <h2 className="h1" style={{ marginBottom: 18 }}>Reusable elements — the building blocks.</h2>

      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 24, marginBottom: 28 }}>
        <div>
          <div className="eyebrow" style={{ marginBottom: 12 }}>Buttons</div>
          <div style={{ display: "flex", flexWrap: "wrap", gap: 10, alignItems: "center" }}>
            <button className="btn btn-primary">Primary</button>
            <button className="btn btn-yellow">Yellow CTA</button>
            <button className="btn btn-secondary">Secondary</button>
            <button className="btn btn-ghost">Ghost</button>
            <button className="btn btn-danger">Destructive</button>
          </div>
          <div style={{ display: "flex", gap: 10, marginTop: 12, alignItems: "center" }}>
            <button className="btn btn-yellow btn-sm">Small</button>
            <button className="btn btn-yellow">Default</button>
            <button className="btn btn-yellow btn-lg">Large</button>
            <button className="btn btn-secondary" disabled>Disabled</button>
          </div>
        </div>

        <div>
          <div className="eyebrow" style={{ marginBottom: 12 }}>Tags & badges</div>
          <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
            <span className="tag beg dot">Beginner</span>
            <span className="tag int dot">Intermediate</span>
            <span className="tag adv dot">Advanced</span>
            <span className="tag">University</span>
            <span className="tag">School</span>
            <span className="tag" style={{ background: "color-mix(in oklab, var(--success) 18%, var(--surface))", color: "#047857" }}>Active</span>
            <span className="tag" style={{ background: "color-mix(in oklab, var(--warning) 18%, var(--surface))", color: "#92400E" }}>Dormant</span>
          </div>
        </div>
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 16, marginBottom: 28 }}>
        <div className="card" style={{ padding: 20 }}>
          <div className="eyebrow" style={{ marginBottom: 10 }}>Input</div>
          <input className="input" placeholder="learner@example.com" />
          <div style={{ fontSize: 11, color: "var(--muted)", marginTop: 6 }}>Helper text · 16px font, 10px padding</div>
        </div>
        <div className="card" style={{ padding: 20 }}>
          <div className="eyebrow" style={{ marginBottom: 10 }}>Input — focused</div>
          <input className="input" style={{ borderColor: "var(--py-blue)", boxShadow: "0 0 0 3px color-mix(in oklab, var(--py-blue) 18%, transparent)" }} defaultValue="maya@apu.edu.my" />
        </div>
        <div className="card" style={{ padding: 20 }}>
          <div className="eyebrow" style={{ marginBottom: 10 }}>Input — error</div>
          <input className="input" style={{ borderColor: "var(--error)" }} defaultValue="bad@email" />
          <div style={{ fontSize: 12, color: "var(--error)", marginTop: 6 }}>That doesn't look like a valid email.</div>
        </div>
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 16, marginBottom: 28 }}>
        <div>
          <div className="eyebrow" style={{ marginBottom: 10 }}>Progress</div>
          <div className="card" style={{ padding: 16 }}>
            <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 6, fontSize: 13 }}>
              <span>Lists & Dictionaries</span><strong>62%</strong>
            </div>
            <div className="progress-bar"><span style={{ width: "62%" }} /></div>
          </div>
        </div>
        <div>
          <div className="eyebrow" style={{ marginBottom: 10 }}>Segmented control</div>
          <div className="seg">
            <button className="on">All</button>
            <button>Beginner</button>
            <button>Advanced</button>
          </div>
        </div>
        <div>
          <div className="eyebrow" style={{ marginBottom: 10 }}>Toggle</div>
          <div style={{ display: "flex", gap: 16 }}>
            <span className="toggle on" />
            <span className="toggle" />
          </div>
        </div>
      </div>

      <div className="eyebrow" style={{ marginBottom: 10 }}>Code block</div>
      <pre className="code-block" style={{ margin: 0 }}>
{`# Lists & Dictionaries · sample
scores = {"Maya": 92, "Yusra": 88}
for name, score in scores.items():
    print(f"{name}: {score}")`}
      </pre>
    </div>
  );
}

const LENS_FEATURES = [

  { ic: "🌗", t: "High contrast", body: "Pure black/white ink, no semi-transparent shadows, thicker borders. Works against both light and dark base themes.", impl: "data-lens-contrast='high' adjusts --ink, --muted, --border tokens." },
  { ic: "👁", t: "Color-blind palettes", body: "Three remappings: deuteranopia, protanopia, tritanopia. Each remaps Python blue + yellow + semantic colors to a CB-safe pairing.", impl: "data-lens-cb='deutan|protan|tritan' overrides --py-blue, --py-yellow, --success, --error." },
  { ic: "🌊", t: "Calm motion mode", body: "Every 3D scene swaps to a static poster image. CSS animations and transitions drop to ~0ms. Honors prefers-reduced-motion at the OS level too.", impl: "data-lens-motion='calm' + animation-duration: 0.001ms !important on all elements." },
  { ic: "🎯", t: "Focus magnifier", body: "A 3px yellow outline + soft shadow tracks the currently focused element. 2× lens (optional toggle) for users who need additional zoom on the focused region.", impl: "Listen for focusin/focusout, position an absolute box over the rect." },

  return (
    <div className="ab-content">
